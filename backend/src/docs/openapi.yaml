openapi: 3.0.3

info:
  title: API del Motor de Aprendizaje Adaptativo
  version: 1.0.0
  description: API REST del proyecto Motor de Aprendizaje Adaptativo Basado en Comportamiento del Estudiante.

servers:
  - url: http://localhost:3000
    description: Desarrollo local

tags:
  - name: Salud
    description: Estado del servicio
  - name: Autenticación
    description: Registro, inicio de sesión y datos del usuario autenticado
  - name: Estudiantes
    description: Resumen, progreso y recomendación del estudiante (parte de los datos aún es simulada)
  - name: Cursos
    description: CRUD de cursos (solo administrador). Eliminar es una baja lógica (estado ARCHIVADO)
  - name: Contenido
    description: CRUD de módulos y temas (administrador o docente editor del curso)

paths:
  /api/health:
    get:
      tags: [Salud]
      operationId: getHealth
      summary: Comprueba que el backend está funcionando
      responses:
        '200':
          description: Backend activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/register:
    post:
      tags: [Autenticación]
      operationId: register
      summary: Registra un estudiante
      description: Todo registro público se crea con el rol `ESTUDIANTE`. Los docentes y administradores se crean por otra vía.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Inicia sesión y devuelve un token JWT
      description: Si el email no existe, la contraseña es incorrecta o el usuario está desactivado, siempre responde `401` con el mismo mensaje.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      tags: [Autenticación]
      operationId: getMe
      summary: Datos del usuario autenticado
      description: Devuelve los datos actuales del usuario dueño del token, consultados en la base de datos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/students/{id}:
    get:
      tags: [Estudiantes]
      operationId: getStudentSummary
      summary: Resumen del estudiante
      description: |
        Un estudiante solo puede consultar su propio id; un docente, solo estudiantes de sus secciones; un administrador, cualquiera.

        **Datos reales** (listados en `datosReales`): nombre, apellido, email, rol, cursos activos, lista de cursos, actividades pendientes, nota promedio y horas de estudio.

        **Datos simulados** (`simulado: true`): porcentaje completado, módulos finalizados y pendientes.

        `notaPromedio` es `null` cuando el estudiante aún no tiene evaluaciones calificadas.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Resumen del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/students/{id}/progress:
    get:
      tags: [Estudiantes]
      operationId: getStudentProgress
      summary: Progreso del estudiante
      description: |
        Mismas reglas de acceso que el resumen.
        Por ahora todos los datos son simulados (`simulado: true`), con el formato final.
        Más adelante vendrán de los intentos del estudiante y del motor adaptativo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Progreso del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/students/{id}/recommendation:
    post:
      tags: [Estudiantes]
      operationId: getStudentRecommendation
      summary: Recomendación del motor adaptativo para un tema
      description: |
        Mismas reglas de acceso que el resumen.
        Arma una interacción por cada intento calificado del estudiante en el tema indicado (por nombre) y la envía al motor adaptativo (Python).
        Si el estudiante no tiene intentos calificados en ese tema, responde 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Recomendación generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cursos:
    post:
      tags: [Cursos]
      operationId: createCourse
      summary: Crea un curso
      description: Solo administrador. El curso nace en estado `BORRADOR`; el autor sale del token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBody'
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Cursos]
      operationId: listCourses
      summary: Lista los cursos
      description: Solo administrador. Ordenados por id descendente.
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado
          schema:
            type: string
            enum: [BORRADOR, ACTIVO, ARCHIVADO]
        - name: limite
          in: query
          required: false
          description: Cantidad máxima de resultados (1 a 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: desplazamiento
          in: query
          required: false
          description: Cantidad de resultados a omitir
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cursos/{id}:
    get:
      tags: [Cursos]
      operationId: getCourse
      summary: Consulta un curso
      description: Solo administrador.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Cursos]
      operationId: updateCourse
      summary: Edita un curso
      description: Solo administrador. Reemplaza código, nombre y descripción (los tres son obligatorios). No se editan cursos `ARCHIVADO`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBody'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cursos/{id}/estado:
    patch:
      tags: [Cursos]
      operationId: changeCourseStatus
      summary: Cambia el estado de un curso (activar o archivar)
      description: |
        Solo administrador. Transiciones permitidas: `BORRADOR` → `ACTIVO`; `BORRADOR` o `ACTIVO` → `ARCHIVADO`.

        **Archivar es la baja lógica (el "eliminar" del CRUD)**: no se borra el historial. Se rechaza (409) si el curso tiene ediciones planificadas, abiertas o en curso. No hay reactivación de cursos archivados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseStatusBody'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos:
    get:
      tags: [Contenido]
      operationId: listModules
      summary: Lista los módulos de un curso
      description: Si no se envía `cursoId`, usa el curso 1. Solo administrador o docente editor del curso.
      security:
        - bearerAuth: []
      parameters:
        - name: cursoId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Lista de módulos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Contenido]
      operationId: createModule
      summary: Crea un módulo
      description: Nace en `BORRADOR` si no se indica estado. `orden` único por curso (409 si se repite).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '201':
          description: Módulo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos/{id}:
    put:
      tags: [Contenido]
      operationId: updateModule
      summary: Edita un módulo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '200':
          description: Módulo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Contenido]
      operationId: deleteModule
      summary: Elimina un módulo
      description: Solo si está en `BORRADOR` y no tiene temas (409 en caso contrario).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Módulo eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos/{id}/estado:
    patch:
      tags: [Contenido]
      operationId: changeModuleStatus
      summary: Cambia el estado de un módulo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentStatusBody'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos/{id}/temas:
    get:
      tags: [Contenido]
      operationId: listTopics
      summary: Lista los temas de un módulo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Lista de temas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Contenido]
      operationId: createTopic
      summary: Crea un tema en un módulo
      description: Nace en `BORRADOR` si no se indica estado. `orden` único por módulo (409 si se repite).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '201':
          description: Tema creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/temas/{id}:
    put:
      tags: [Contenido]
      operationId: updateTopic
      summary: Edita un tema
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '200':
          description: Tema actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Contenido]
      operationId: deleteTopic
      summary: Elimina un tema
      description: Solo si está en `BORRADOR` y no tiene actividades (409 en caso contrario).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Tema eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/temas/{id}/estado:
    patch:
      tags: [Contenido]
      operationId: changeTopicStatus
      summary: Cambia el estado de un tema
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentStatusBody'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /api/auth/login`.

  parameters:
    StudentId:
      name: id
      in: path
      required: true
      description: Id del estudiante
      schema:
        type: integer
        minimum: 1
        example: 4
    CourseId:
      name: id
      in: path
      required: true
      description: Id del curso
      schema:
        type: integer
        minimum: 1
        example: 1
    ContentId:
      name: id
      in: path
      required: true
      description: Id del módulo o del tema, según la ruta
      schema:
        type: integer
        minimum: 1
        example: 1

  responses:
    BadRequest:
      description: Datos inválidos o JSON mal formado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Credenciales inválidas, o token requerido, inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Credenciales inválidas
    Forbidden:
      description: No tienes permiso para esta acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: No tienes permiso para esta acción
    NotFound:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: El recurso no existe
    Conflict:
      description: El recurso ya existe o la operación no es válida en su estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Ya existe un curso con ese código
    ServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Error interno del servidor

  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend
        timestamp:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [nombre, apellido, email, password]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 50
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 50
          example: Lopez
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: Clave1234

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          format: password
          example: Clave1234

    User:
      type: object
      required: [id, nombre, apellido, email, rol]
      properties:
        id:
          type: integer
          example: 4
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Lopez
        email:
          type: string
          format: email
          example: ana@example.com
        rol:
          type: string
          enum: [ESTUDIANTE, DOCENTE, ADMINISTRADOR]
          example: ESTUDIANTE

    RegisterResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/User'

    LoginResponse:
      type: object
      required: [success, token, user]
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT que se envía en el encabezado Authorization. Expira en 2 horas.
