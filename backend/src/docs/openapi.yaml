openapi: 3.0.3

info:
  title: API del Motor de Aprendizaje Adaptativo
  version: 1.0.0
  description: API REST del proyecto Motor de Aprendizaje Adaptativo Basado en Comportamiento del Estudiante.

servers:
  - url: http://localhost:3000
    description: Desarrollo local

tags:
  - name: Salud
    description: Estado del servicio
  - name: Autenticación
    description: Registro, inicio de sesión y datos del usuario autenticado
  - name: Estudiantes
    description: Resumen, progreso y recomendación del estudiante (parte de los datos aún es simulada)
  - name: Cursos
    description: CRUD de cursos (solo administrador). Eliminar es una baja lógica (estado ARCHIVADO)
  - name: Contenido
    description: Selector de cursos y CRUD de módulos y temas (administrador o docente editor del curso)
  - name: Aprendizaje del estudiante
    description: Cursos, contenido publicado, intentos, resultados, progreso y recomendación del estudiante autenticado. Todas las rutas son de autoservicio (rol ESTUDIANTE) y el estudiante sale siempre del token.

paths:
  /api/health:
    get:
      tags: [Salud]
      operationId: getHealth
      summary: Comprueba que el backend está funcionando
      responses:
        '200':
          description: Backend activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/register:
    post:
      tags: [Autenticación]
      operationId: register
      summary: Registra un estudiante
      description: Todo registro público se crea con el rol `ESTUDIANTE`. Los docentes y administradores se crean por otra vía.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Inicia sesión y devuelve un token JWT
      description: Si el email no existe, la contraseña es incorrecta o el usuario está desactivado, siempre responde `401` con el mismo mensaje.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      tags: [Autenticación]
      operationId: getMe
      summary: Datos del usuario autenticado
      description: Devuelve los datos actuales del usuario dueño del token, consultados en la base de datos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/students/{id}:
    get:
      tags: [Estudiantes]
      operationId: getStudentSummary
      summary: Resumen del estudiante
      description: |
        Un estudiante solo puede consultar su propio id; un docente, solo estudiantes de sus secciones; un administrador, cualquiera.

        **Datos reales** (listados en `datosReales`): nombre, apellido, email, rol, cursos activos, lista de cursos, actividades pendientes, nota promedio y horas de estudio.

        **Datos simulados** (`simulado: true`): porcentaje completado, módulos finalizados y pendientes.

        `notaPromedio` es `null` cuando el estudiante aún no tiene evaluaciones calificadas.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Resumen del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/students/{id}/progress:
    get:
      tags: [Estudiantes]
      operationId: getStudentProgress
      summary: Progreso del estudiante
      description: |
        Mismas reglas de acceso que el resumen.
        Por ahora todos los datos son simulados (`simulado: true`), con el formato final.
        Más adelante vendrán de los intentos del estudiante y del motor adaptativo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Progreso del estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/students/{id}/recommendation:
    post:
      tags: [Estudiantes]
      operationId: getStudentRecommendation
      summary: Recomendación del motor adaptativo para un tema
      description: |
        Mismas reglas de acceso que el resumen.
        Arma una interacción por cada intento calificado del estudiante en el tema indicado (por nombre) y la envía al motor adaptativo (Python).
        **Se mantiene por compatibilidad.** Preferir `POST /api/mis-inscripciones/{inscripcionId}/temas/{temaId}/recomendacion`, que no mezcla temas homónimos.
        Si el estudiante no tiene intentos calificados en ese tema, responde 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Recomendación generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cursos:
    post:
      tags: [Cursos]
      operationId: createCourse
      summary: Crea un curso
      description: Solo administrador. El curso nace en estado `BORRADOR`; el autor sale del token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBody'
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Cursos]
      operationId: listCourses
      summary: Lista los cursos
      description: Solo administrador. Ordenados por id descendente.
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado
          schema:
            type: string
            enum: [BORRADOR, ACTIVO, ARCHIVADO]
        - name: limite
          in: query
          required: false
          description: Cantidad máxima de resultados (1 a 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: desplazamiento
          in: query
          required: false
          description: Cantidad de resultados a omitir
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cursos/{id}:
    get:
      tags: [Cursos]
      operationId: getCourse
      summary: Consulta un curso
      description: Solo administrador.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Cursos]
      operationId: updateCourse
      summary: Edita un curso
      description: Solo administrador. Reemplaza código, nombre y descripción (los tres son obligatorios). No se editan cursos `ARCHIVADO`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBody'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cursos/{id}/estado:
    patch:
      tags: [Cursos]
      operationId: changeCourseStatus
      summary: Cambia el estado de un curso (activar o archivar)
      description: |
        Solo administrador. Transiciones permitidas: `BORRADOR` → `ACTIVO`; `BORRADOR` o `ACTIVO` → `ARCHIVADO`.

        **Archivar es la baja lógica (el "eliminar" del CRUD)**: no se borra el historial. Se rechaza (409) si el curso tiene ediciones planificadas, abiertas o en curso. No hay reactivación de cursos archivados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseStatusBody'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos:
    get:
      tags: [Contenido]
      operationId: listModules
      summary: Lista los módulos de un curso
      description: Si no se envía `cursoId`, usa el curso 1. Solo administrador o docente editor del curso.
      security:
        - bearerAuth: []
      parameters:
        - name: cursoId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Lista de módulos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Contenido]
      operationId: createModule
      summary: Crea un módulo
      description: Nace en `BORRADOR` si no se indica estado. `orden` único por curso (409 si se repite).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '201':
          description: Módulo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos/{id}:
    put:
      tags: [Contenido]
      operationId: updateModule
      summary: Edita un módulo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '200':
          description: Módulo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Contenido]
      operationId: deleteModule
      summary: Elimina un módulo
      description: Solo si está en `BORRADOR` y no tiene temas (409 en caso contrario).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Módulo eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos/{id}/estado:
    patch:
      tags: [Contenido]
      operationId: changeModuleStatus
      summary: Cambia el estado de un módulo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentStatusBody'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/modulos/{id}/temas:
    get:
      tags: [Contenido]
      operationId: listTopics
      summary: Lista los temas de un módulo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Lista de temas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Contenido]
      operationId: createTopic
      summary: Crea un tema en un módulo
      description: Nace en `BORRADOR` si no se indica estado. `orden` único por módulo (409 si se repite).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '201':
          description: Tema creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/temas/{id}:
    put:
      tags: [Contenido]
      operationId: updateTopic
      summary: Edita un tema
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBody'
      responses:
        '200':
          description: Tema actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Contenido]
      operationId: deleteTopic
      summary: Elimina un tema
      description: Solo si está en `BORRADOR` y no tiene actividades (409 en caso contrario).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Tema eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/temas/{id}/estado:
    patch:
      tags: [Contenido]
      operationId: changeTopicStatus
      summary: Cambia el estado de un tema
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentStatusBody'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cursos-administrables:
    get:
      tags: [Contenido]
      operationId: listManageableCourses
      summary: Cursos que el usuario puede gestionar
      description: |
        Administrador: todos los cursos. Docente: solo los cursos donde es editor activo.
        `puedeEditarContenido` es falso en cursos archivados. Sirve como selector de curso
        para la gestión de módulos y temas (enviar siempre el `cursoId` elegido).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageableCourseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-cursos:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyEnrollments
      summary: Inscripciones activas del estudiante
      description: |
        Solo rol `ESTUDIANTE`. De aquí sale el `inscripcionId` que usan el resto de rutas de aprendizaje.
        Incluye solo inscripciones activas en cursos activos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-cursos/{cursoId}/modulos:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyModules
      summary: Módulos publicados de un curso
      description: |
        Solo módulos `PUBLICADO` de un curso donde el estudiante tiene inscripción activa. `totalTemas` cuenta solo temas publicados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CursoPathId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-modulos/{moduloId}/temas:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyTopics
      summary: Temas publicados de un módulo
      description: |
        Una lista vacía es válida (módulo sin temas publicados). Módulo no publicado: 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModuloPathId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-inscripciones/{inscripcionId}/resultados:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyResults
      summary: Resultados por actividad
      description: |
        Una fila por actividad visible, incluidas las pendientes (sin intentos).
        Antes de calificar, los promedios y la fecha son `null` (nunca 0). Las prácticas no tienen nota académica.
        Para la lista de evaluaciones, filtrar `finalidad = EVALUACION`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InscripcionId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-inscripciones/{inscripcionId}/progreso:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyProgress
      summary: Progreso por tema
      description: |
        Una actividad publicada cuenta como realizada si tiene al menos un intento calificado (sin nota mínima).
        Un tema sin actividades devuelve `progresoPorcentaje: null` y `completado: false`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InscripcionId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-inscripciones/{inscripcionId}/actividad-reciente:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyRecentActivity
      summary: Actividad reciente
      description: |
        Un evento por intento entregado o calificado, del más reciente al más antiguo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InscripcionId'
        - name: limite
          in: query
          required: false
          description: Cantidad de eventos (1 a 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentActivityListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-inscripciones/{inscripcionId}/minutos:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyMinutes
      summary: Minutos de intentos por día
      description: |
        Tiempo transcurrido entre inicio y entrega, agrupado por día local (America/Santo_Domingo).
        Intervalo semiabierto: `desde` se incluye, `hasta` no. Máximo 366 días. Los días sin intentos no aparecen.
        No es tiempo activo de estudio: incluye pausas.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InscripcionId'
        - name: desde
          in: query
          required: true
          description: Fecha inicial (AAAA-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-11-02"
        - name: hasta
          in: query
          required: true
          description: Fecha final exclusiva (AAAA-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-11-09"
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinutesListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-inscripciones/{inscripcionId}/temas/{temaId}/actividades:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: listMyActivities
      summary: Actividades publicadas de un tema
      description: |
        Solo de la sección de esa inscripción. `disponibleAhora` no garantiza que pueda iniciar:
        el máximo de intentos y un intento abierto se validan al iniciar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InscripcionId'
        - $ref: '#/components/parameters/TemaPathId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-inscripciones/{inscripcionId}/actividades/{actividadId}/intentos:
    post:
      tags: [Aprendizaje del estudiante]
      operationId: startAttempt
      summary: Inicia un intento y devuelve el cuestionario
      description: |
        Consume una oportunidad de intento. Inicia el intento y lee el cuestionario en una sola transacción.
        El cuestionario **no incluye** respuestas correctas ni explicaciones.
        `409` si la actividad no está disponible, ya hay un intento abierto o se alcanzó el límite.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InscripcionId'
        - $ref: '#/components/parameters/ActividadPathId'
      responses:
        '201':
          description: Intento iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-intentos/{intentoId}/cuestionario:
    get:
      tags: [Aprendizaje del estudiante]
      operationId: getQuestionnaire
      summary: Retoma el cuestionario de un intento en curso
      description: |
        No crea intentos. Devuelve las selecciones ya guardadas. Intento ajeno: 403. Cerrado o vencido: 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntentoPathId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-respuestas/{respuestaId}/opciones:
    put:
      tags: [Aprendizaje del estudiante]
      operationId: saveSelection
      summary: Guarda la selección de una pregunta
      description: |
        Reemplaza toda la selección anterior de esa pregunta. Enviar solo ids de opciones; una lista vacía borra la selección.
        En selección única se permite como máximo una opción.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RespuestaPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionBody'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-intentos/{intentoId}/entrega:
    post:
      tags: [Aprendizaje del estudiante]
      operationId: submitAttempt
      summary: Entrega el intento y lo califica
      description: |
        La calificación se hace siempre en el servidor, en la misma transacción que la entrega. No existe ruta pública de calificación.
        Si el intento ya venció, `motivoEntrega` es `VENCIMIENTO`. Repetir la entrega devuelve el resultado ya calculado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntentoPathId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/mis-inscripciones/{inscripcionId}/temas/{temaId}/recomendacion:
    post:
      tags: [Aprendizaje del estudiante]
      operationId: getRecommendationByContext
      summary: Recomendación del motor adaptativo por inscripción y tema
      description: |
        Arma una interacción por cada intento calificado del estudiante en ese tema y esa inscripción, y la envía al motor (Python).
        No mezcla temas homónimos de otros cursos. `404` si aún no hay intentos calificados.
        `mastery` es el promedio de puntaje, `errors` el total de respuestas con puntaje 0 y `attempts` el promedio del número de intento.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InscripcionId'
        - $ref: '#/components/parameters/TemaPathId'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /api/auth/login`.

  parameters:
    StudentId:
      name: id
      in: path
      required: true
      description: Id del estudiante
      schema:
        type: integer
        minimum: 1
        example: 4
    CourseId:
      name: id
      in: path
      required: true
      description: Id del curso
      schema:
        type: integer
        minimum: 1
        example: 1
    ContentId:
      name: id
      in: path
      required: true
      description: Id del módulo o del tema, según la ruta
      schema:
        type: integer
        minimum: 1
        example: 1

    InscripcionId:
      name: inscripcionId
      in: path
      required: true
      description: Id de la inscripción del estudiante (sale de GET /api/mis-cursos)
      schema:
        type: integer
        minimum: 1
        example: 7
    CursoPathId:
      name: cursoId
      in: path
      required: true
      description: Id del curso
      schema:
        type: integer
        minimum: 1
        example: 7
    ModuloPathId:
      name: moduloId
      in: path
      required: true
      description: Id del módulo
      schema:
        type: integer
        minimum: 1
        example: 16
    TemaPathId:
      name: temaId
      in: path
      required: true
      description: Id del tema
      schema:
        type: integer
        minimum: 1
        example: 15
    ActividadPathId:
      name: actividadId
      in: path
      required: true
      description: Id de la actividad
      schema:
        type: integer
        minimum: 1
        example: 10
    IntentoPathId:
      name: intentoId
      in: path
      required: true
      description: Id del intento
      schema:
        type: integer
        minimum: 1
        example: 16
    RespuestaPathId:
      name: respuestaId
      in: path
      required: true
      description: Id de la respuesta (viene en el cuestionario como `respuestaId`)
      schema:
        type: integer
        minimum: 1
        example: 48

  responses:
    BadRequest:
      description: Datos inválidos o JSON mal formado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Credenciales inválidas, o token requerido, inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Credenciales inválidas
    Forbidden:
      description: No tienes permiso para esta acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: No tienes permiso para esta acción
    NotFound:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: El recurso no existe
    Conflict:
      description: El recurso ya existe o la operación no es válida en su estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Ya existe un curso con ese código
    ServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Error interno del servidor

  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: backend
        timestamp:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [nombre, apellido, email, password]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 50
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 50
          example: Lopez
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: Clave1234

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: ana@example.com
        password:
          type: string
          format: password
          example: Clave1234

    User:
      type: object
      required: [id, nombre, apellido, email, rol]
      properties:
        id:
          type: integer
          example: 4
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Lopez
        email:
          type: string
          format: email
          example: ana@example.com
        rol:
          type: string
          enum: [ESTUDIANTE, DOCENTE, ADMINISTRADOR]
          example: ESTUDIANTE

    RegisterResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/User'

    LoginResponse:
      type: object
      required: [success, token, user]
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT que se envía en el encabezado Authorization. Expira en 2 horas.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/User'

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    ValidationError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Datos inválidos
        details:
          type: array
          description: Presente cuando falla la validación de campos.
          items:
            type: object
            properties:
              campo:
                type: string
                example: password
              mensaje:
                type: string
                example: La contraseña debe tener al menos 8 caracteres

    CourseEnrollment:
      type: object
      properties:
        cursoId:
          type: integer
          example: 1
        nombre:
          type: string
          example: Cálculo
        seccion:
          type: string
          example: SEC 1
        estado:
          type: string
          example: ACTIVA

    StudentSummary:
      type: object
      properties:
        id:
          type: integer
          example: 4
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Lopez
        email:
          type: string
          example: ana@example.com
        rol:
          type: string
          example: ESTUDIANTE
        cursosActivos:
          type: integer
          example: 1
        cursos:
          type: array
          items:
            $ref: '#/components/schemas/CourseEnrollment'
        porcentajeCompletado:
          type: number
          example: 72
        modulosFinalizados:
          type: integer
          example: 18
        modulosPendientes:
          type: integer
          example: 7
        actividadesPendientes:
          type: integer
          example: 8
        notaPromedio:
          type: number
          nullable: true
          example: 86
        horasEstudio:
          type: number
          example: 32

    StudentSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        simulado:
          type: boolean
          description: true mientras parte de los datos sea simulada
          example: true
        datosReales:
          type: array
          description: Campos que ya salen de la base de datos
          items:
            type: string
        student:
          $ref: '#/components/schemas/StudentSummary'

    Recommendation:
      type: object
      properties:
        tema:
          type: string
          example: SQL JOIN
        accion:
          type: string
          example: reinforce_topic
        dificultad:
          type: string
          example: reduced
        prioridad:
          type: string
          example: alta
        descripcion:
          type: string
        motivo:
          type: object
          properties:
            puntuacionPromedio:
              type: number
              example: 53.3
            erroresAcumulados:
              type: integer
              example: 9
            intentosPromedio:
              type: number
              example: 3.0

    StudentProgress:
      type: object
      properties:
        variaciones:
          type: object
          properties:
            porcentajeSemanal:
              type: number
              example: 5
            cursosMes:
              type: integer
              example: 1
            actividadesSemana:
              type: integer
              example: -2
            notaPuntos:
              type: number
              example: 3
            horasSemana:
              type: number
              example: 6
        recomendacion:
          $ref: '#/components/schemas/Recommendation'

    StudentProgressResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        simulado:
          type: boolean
          example: true
        progress:
          $ref: '#/components/schemas/StudentProgress'

    RecommendationRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          maxLength: 100
          example: Operaciones y números pares

    RecommendationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        recommendation:
          type: object
          properties:
            studentId:
              type: integer
              example: 4
            tema:
              type: string
              example: Operaciones y números pares
            accion:
              type: string
              example: reinforce_topic
            dificultad:
              type: string
              example: reduced
            recomendacion:
              type: string
            mastery:
              type: number
              description: Promedio de puntaje (0 a 100) de los intentos calificados en el tema
              example: 66.7
            errors:
              type: integer
              description: Total de respuestas con puntaje 0 en esos intentos
              example: 2
            attempts:
              type: number
              description: Promedio del número de intento
              example: 1.5

    Course:
      type: object
      properties:
        id:
          type: integer
          example: 1
        codigo:
          type: string
          example: PROG-101
        nombre:
          type: string
          example: Programación
        descripcion:
          type: string
          example: Curso de prueba
        estado:
          type: string
          enum: [BORRADOR, ACTIVO, ARCHIVADO]
          example: BORRADOR
        creadoPor:
          type: integer
          example: 8
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time

    CourseBody:
      type: object
      required: [codigo, nombre, descripcion]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 50
          example: PROG-101
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Programación
        descripcion:
          type: string
          minLength: 1
          maxLength: 1000
          example: Curso de prueba

    CourseStatusBody:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [ACTIVO, ARCHIVADO]
          example: ACTIVO

    CourseResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Course'

    CourseListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Course'

    ContentBody:
      type: object
      required: [nombre, descripcion, orden]
      properties:
        nombre:
          type: string
          maxLength: 150
          example: Límites
        descripcion:
          type: string
          maxLength: 1000
          example: Introducción al estudio de límites
        orden:
          type: integer
          minimum: 1
          example: 9
        estado:
          type: string
          enum: [BORRADOR, PUBLICADO, ARCHIVADO]
          example: BORRADOR
        cursoId:
          type: integer
          minimum: 1
          description: Solo para módulos. Por defecto 1.
          example: 1

    ContentStatusBody:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [BORRADOR, PUBLICADO, ARCHIVADO]
          example: PUBLICADO

    Module:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cursoId:
          type: integer
          example: 1
        nombre:
          type: string
        descripcion:
          type: string
        orden:
          type: integer
        estado:
          type: string
          enum: [BORRADOR, PUBLICADO, ARCHIVADO]
        totalTemas:
          type: integer
        actualizadoEn:
          type: string
          format: date-time

    Topic:
      type: object
      properties:
        id:
          type: integer
          example: 1
        moduloId:
          type: integer
          example: 1
        nombre:
          type: string
